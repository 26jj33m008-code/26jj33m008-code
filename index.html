<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SKY OBBY 점프맵</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8bdcff;font-family:system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;color:white;text-shadow:0 2px 5px #123;font-weight:900;pointer-events:none;background:#123b79bb;padding:10px 20px;border-radius:15px;min-width:230px}#hud strong{font-size:22px}#msg{font-size:14px}#help{position:fixed;bottom:12px;left:12px;color:white;background:#123b79bb;padding:10px;border-radius:12px;font-size:12px;line-height:1.6}#reset{position:fixed;right:12px;top:12px;border:0;border-radius:12px;padding:11px 14px;background:#ffcf45;font-weight:900}#touch{display:none;position:fixed;right:12px;bottom:15px;gap:6px}#touch button{width:52px;height:52px;border:2px solid white;border-radius:14px;background:#123b79bb;color:white;font-size:22px;font-weight:900;touch-action:none}#touch #jump{background:#f90} @media(max-width:700px){#touch{display:flex}#help{bottom:78px}}</style></head><body>
<div id="hud"><strong>☁️ SKY OBBY</strong><div id="stats">스테이지 1 / 8　⭐ 0</div><div id="msg">점프해서 결승점까지 가자!</div></div><button id="reset">다시 시작 ↻</button><div id="help">이동: WASD / 방향키<br>점프: SPACE<br>화면 드래그: 카메라 회전</div><div id="touch"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button id="jump">⤒</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bdcff);scene.fog=new THREE.Fog(0x8bdcff,40,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x537a9c,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-10,20,12);sun.castShadow=true;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
const blocks=[];function block(x,y,z,w,d,c,type='safe'){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.55,d),material(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);blocks.push({x,y:y-.275,z,w,d,type,mesh:m});return m}
block(0,0,0,8,8,0x5bcf80);
const course=[[0,0,-8,4,4],[4,1,-14,3.5,3.5],[8,2,-20,3.4,3.4],[4,3,-26,3.2,3.2],[-2,4,-32,3.2,3.2],[-7,5,-38,3.2,3.2],[-2,6,-44,3.5,3.5],[4,7,-51,5,5]];
course.forEach((p,i)=>{block(...p.slice(0,5),[0xffbf45,0x61a8ff,0xb58aff,0xff79a8,0x62d6bd,0xffa45b,0x7b9cff,0xffdf52][i]);if([2,4,6].includes(i)){const h=new THREE.Mesh(new THREE.ConeGeometry(.55,1.2,5),material(0xff304f));h.position.set(p[0],p[1]+.9,p[2]);scene.add(h);blocks.push({x:p[0],y:p[1]+.2,z:p[2],w:1,d:1,type:'bad'})}});
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.48),material(0x2675ff));torso.position.y=.9;player.add(torso);const head=new THREE.Mesh(new THREE.BoxGeometry(.68,.65,.62),material(0xffd0a0));head.position.y=1.7;player.add(head);for(const x of [-.17,.17]){const eye=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.04),material(0x17233b));eye.position.set(x,1.78,-.33);player.add(eye)}scene.add(player);
const finish=new THREE.Mesh(new THREE.TorusGeometry(1.2,.16,12,32),new THREE.MeshStandardMaterial({color:0xffdf45,emissive:0x886000}));finish.position.set(4,8.6,-51);scene.add(finish);
for(let i=0;i<20;i++){const cloud=new THREE.Group();for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1.1,12,10),material(0xffffff));puff.position.set(j*.8,Math.random()*.3,0);cloud.add(puff)}cloud.position.set((Math.random()-.5)*70,12+Math.random()*18,-Math.random()*70);scene.add(cloud)}
let stage=0,score=0,checkpoint=0,won=false,vel=new THREE.Vector3(),ground=false,yaw=0,drag=false,lastX=0;const keys={};
function spawn(i=0){const p=i===0?[0,.7,0]:[course[i-1][0],course[i-1][1]+.8,course[i-1][2]];player.position.set(...p);vel.set(0,0,0)}
function hud(t){document.querySelector('#stats').textContent='스테이지 '+(stage+1)+' / 8　⭐ '+score;if(t)document.querySelector('#msg').textContent=t}
function reset(){stage=score=checkpoint=0;won=false;spawn();hud('처음부터 다시 도전!')}document.querySelector('#reset').onclick=reset;
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&ground&&!e.repeat){vel.y=10;ground=false}});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();if(ground){vel.y=10;ground=false}};
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.035);
if(!won){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);const dir=new THREE.Vector3(s,0,-f);if(dir.length())dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);vel.x+=(dir.x*9-vel.x*5)*dt;vel.z+=(dir.z*9-vel.z*5)*dt;vel.y-=22*dt;const old=player.position.y;player.position.x+=vel.x*dt;player.position.z+=vel.z*dt;player.position.y+=vel.y*dt;ground=false;
for(const p of blocks){if(p.type!=='safe')continue;if(Math.abs(player.position.x-p.x)<p.w/2+.25&&Math.abs(player.position.z-p.z)<p.d/2+.25&&vel.y<=0&&old>=p.y+.7&&player.position.y<=p.y+.7){player.position.y=p.y+.7;vel.y=0;ground=true}}
for(const p of blocks){if(p.type==='bad'&&Math.abs(player.position.x-p.x)<.7&&Math.abs(player.position.z-p.z)<.7&&Math.abs(player.position.y-p.y)<1.3){spawn(checkpoint);hud('장애물에 닿았어! 다시 도전!')}}
if(player.position.y< -5){spawn(checkpoint);hud('떨어졌어! 체크포인트에서 재시작!')}
course.forEach((p,i)=>{if(i>=stage&&Math.abs(player.position.x-p[0])<1.5&&Math.abs(player.position.z-p[2])<1.5&&player.position.y>p[1]+.4){stage=i+1;checkpoint=i+1;score=stage;hud('체크포인트 저장!')}});if(player.position.distanceTo(new THREE.Vector3(4,8,-51))<2.5&&stage>=8){won=true;score=8;hud('🏆 완주 성공! 대단해!')}}
const target=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z);camera.position.lerp(target.clone().add(new THREE.Vector3(Math.sin(yaw)*9,5.5,Math.cos(yaw)*9)),.1);camera.lookAt(target);renderer.render(scene,camera)}
loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
