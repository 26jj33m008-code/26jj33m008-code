<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>두더지 잡기! 10초 챌린지</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#bcecff 0 43%,#8bcf63 43%);font-family:system-ui,sans-serif;color:#23402b}.game{width:min(94vw,650px);text-align:center;padding:20px}h1{font-size:clamp(28px,6vw,44px);margin:4px}.stats{display:flex;justify-content:center;gap:12px;margin:16px}.stat{background:white;border:3px solid #639b4b;border-radius:14px;padding:8px 20px;font-weight:800}.stat b{display:block;font-size:26px;color:#28733d}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#a86c3b;border:7px solid #754323;border-radius:20px;padding:14px;box-shadow:0 8px #5d371f}.hole{height:clamp(100px,19vw,145px);border:0;border-radius:50%;background:radial-gradient(ellipse,#29180f 0 45%,#5a351e 46% 58%,#c38b55 59% 70%,#714323 71%);position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation}.mole{display:none;position:absolute;bottom:-6%;left:15%;width:70%;height:85%;border-radius:48% 48% 35% 35%;background:linear-gradient(110deg,#b8794c,#714126 70%,#4b2a1a);box-shadow:inset -8px -6px #482719}.mole:before{content:"";position:absolute;left:23%;top:39%;width:11px;height:14px;border-radius:50%;background:white;box-shadow:34px 0 white}.mole:after{content:"";position:absolute;left:27%;top:44%;width:6px;height:8px;border-radius:50%;background:#17100c;box-shadow:34px 0 #17100c}.nose{position:absolute;left:44%;top:60%;width:13%;height:10%;border-radius:50%;background:#efaaaa}.up .mole{display:block;animation:pop .12s ease-out}@keyframes pop{from{transform:translateY(25%)}to{transform:translateY(0)}}button#start{margin:20px;background:#ffd34f;border:0;border-radius:13px;padding:13px 32px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px #bd8a22;color:#573c0c}#message{min-height:28px;font-weight:800;font-size:18px}small{color:#315a38}
</style>
</head>
<body><main class="game"><h1>🐹 두더지 잡기!</h1><p>10초 안에 두더지를 최대한 많이 잡아봐!</p>
<div class="stats"><div class="stat">점수<b id="score">0</b></div><div class="stat">남은 시간<b id="time">10</b></div><div class="stat">최고 기록<b id="best">0</b></div></div>
<div id="board"></div><button id="start">게임 시작!</button><div id="message">시작 버튼을 누르면 게임이 시작돼!</div><p><small>두더지를 클릭하거나 터치해! 마우스와 모바일 모두 지원해.</small></p></main>
<script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),message=document.querySelector('#message'),startBtn=document.querySelector('#start');
let score=0,time=10,active=-1,running=false,clock,moleClock,best=Number(localStorage.getItem('moleBest')||0);bestEl.textContent=best;
const holes=[];
for(let i=0;i<9;i++){const h=document.createElement('button');h.className='hole';h.setAttribute('aria-label','두더지 구멍');h.innerHTML='<div class="mole"><div class="nose"></div></div>';h.addEventListener('pointerdown',e=>{e.preventDefault();if(running&&i===active){score++;scoreEl.textContent=score;showMole();message.textContent='잘했어! 계속 잡아봐!'}});board.append(h);holes.push(h)}
function hide(){holes.forEach(h=>h.classList.remove('up'));active=-1}
function showMole(){hide();if(!running)return;active=Math.floor(Math.random()*9);holes[active].classList.add('up')}
function finish(){running=false;clearInterval(clock);clearInterval(moleClock);hide();time=0;timeEl.textContent='0';if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('moleBest',best);message.textContent='🏆 신기록! '+score+'점!'}else message.textContent='🎉 게임 끝! '+score+'점! 다시 도전해봐!';startBtn.disabled=false;startBtn.textContent='다시 하기'}
function start(){clearInterval(clock);clearInterval(moleClock);score=0;time=10;running=true;scoreEl.textContent='0';timeEl.textContent='10';message.textContent='두더지를 잡아라!';startBtn.disabled=true;startBtn.textContent='게임 중...';showMole();moleClock=setInterval(showMole,620);clock=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
startBtn.addEventListener('click',start);
</script></body></html>
